<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>cherry tree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background Canvas: Floating Hello Kitty Cats & Falling Cherry Blossoms -->
  <canvas id="bg-canvas"></canvas>

  <!-- Password Lock Screen -->
  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <h1 class="site-title">cherry tree</h1>
      <form id="password-form" autocomplete="off">
        <input
          type="password"
          id="password-input"
          class="password-input"
          placeholder="••••/••/••"
          inputmode="text"
          autofocus
        />
      </form>
    </div>
  </div>

  <!-- Main Website -->
  <div id="app" class="app hidden">
    <!-- Top Header -->
    <header class="top-bar">
      <h1 class="brand-title" id="home-tree-btn">cherry tree</h1>

      <nav class="page-tabs" aria-label="pages">
        <button class="tab-btn active" data-page="songs">songs</button>
        <button class="tab-btn" data-page="poems">poems</button>
        <button class="tab-btn" data-page="images">images</button>
      </nav>

      <div class="top-actions">
        <button id="firebase-btn" class="icon-btn" title="firebase">
          <span class="status-dot" id="sync-dot"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 10 Branches Selector Bar -->
    <div class="branch-bar" id="branch-bar"></div>

    <!-- Centerpiece Stage: Ultra-Realistic Cherry Tree & Branch 27-Slot View -->
    <main class="stage">
      <!-- Full Cherry Tree View with 10 Interactive Branches -->
      <section id="tree-view" class="tree-view">
        <div class="tree-container" id="tree-container">
          <canvas id="tree-canvas" width="1400" height="1100"></canvas>
          <div id="branch-hotspots" class="branch-hotspots"></div>
        </div>
      </section>

      <!-- Focused Branch View: 27 Blossom Slots on the Selected Branch -->
      <section id="branch-view" class="branch-view hidden">
        <div class="branch-header">
          <button id="back-to-tree" class="pill-btn">←</button>
          <span id="branch-label" class="branch-number-label">1</span>
        </div>
        <div class="branch-stage-wrap">
          <canvas id="single-branch-canvas" width="1400" height="750"></canvas>
          <div id="slots-grid" class="slots-container"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Slot Memory Modal (Song / Poem / Image) -->
  <div id="slot-modal" class="modal hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-card">
      <div class="modal-header">
        <span id="modal-slot-id" class="modal-slot-id">1 · 1</span>
        <button id="close-modal" class="icon-btn">✕</button>
      </div>

      <!-- SONGS MODE -->
      <div id="modal-songs" class="modal-body hidden">
        <div id="song-player-area" class="media-preview hidden"></div>
        <div class="input-group">
          <input
            type="text"
            id="song-title-input"
            class="soft-input"
            placeholder="title"
          />
          <input
            type="url"
            id="song-url-input"
            class="soft-input"
            placeholder="youtube link"
          />
          <label class="file-upload-btn" for="song-file-input">
            <span id="song-file-label">mp3</span>
            <input type="file" id="song-file-input" accept="audio/*,.mp3,.m4a,.wav" hidden />
          </label>
        </div>
      </div>

      <!-- POEMS MODE -->
      <div id="modal-poems" class="modal-body hidden">
        <input
          type="text"
          id="poem-title-input"
          class="soft-input"
          placeholder="title"
        />
        <textarea
          id="poem-text-input"
          class="soft-textarea"
          rows="8"
          placeholder="..."
        ></textarea>
      </div>

      <!-- IMAGES MODE -->
      <div id="modal-images" class="modal-body hidden">
        <div id="image-preview-area" class="media-preview hidden">
          <img id="slot-image-preview" src="" alt="" />
        </div>
        <label class="file-upload-btn large-upload" for="image-file-input">
          <span>+</span>
          <input type="file" id="image-file-input" accept="image/*" hidden />
        </label>
        <input
          type="text"
          id="image-caption-input"
          class="soft-input"
          placeholder="..."
        />
      </div>

      <div class="modal-footer">
        <button id="delete-slot-btn" class="pill-btn danger-btn hidden">✕</button>
        <button id="save-slot-btn" class="pill-btn save-btn">✓</button>
      </div>
    </div>
  </div>

  <!-- Firebase Config Modal (for pasting Firebase config directly in browser) -->
  <div id="firebase-modal" class="modal hidden">
    <div class="modal-backdrop" id="firebase-backdrop"></div>
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-slot-id">firebase</span>
        <button id="close-firebase-modal" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <textarea
          id="firebase-json-input"
          class="soft-textarea"
          rows="7"
          placeholder='{ "apiKey": "...", "databaseURL": "...", "projectId": "..." }'
        ></textarea>
      </div>
      <div class="modal-footer">
        <button id="save-firebase-btn" class="pill-btn save-btn">✓</button>
      </div>
    </div>
  </div>

  <!-- Foreground Falling Petals Overlay Canvas -->
  <canvas id="fg-canvas"></canvas>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
